# =============================================================================
#  AgriWater — PostgreSQL 16 en local de développement
#
#  Le conteneur a été créé manuellement (`docker run`) ; ce fichier décrit
#  exactement la même instance, avec en plus les réglages de ressources et de
#  sécurité qui comptent pour les performances.
#
#  Démarrage :
#    docker compose up -d
#  Arrêt :
#    docker compose down
#
#  Attention : si le conteneur `agriwater-postgres` a été créé avec `docker run`,
#  arrêter ce compose ne le supprime pas. Dans ce cas :
#    docker rm -f agriwater-postgres   puis   docker compose up -d
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: agriwater-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agriwater
      POSTGRES_USER: agriwater
      POSTGRES_PASSWORD: agriwater
      # Locale et collation française : tri et comparaisons de libellés cohérents
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=fr_FR.utf8 --lc-collate=fr_FR.utf8 --lc-ctype=fr_FR.utf8"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
      PGTZ: UTC

    ports:
      # 5434 en hôte : les installations PostgreSQL locales occupent déjà 5432
      - "0.0.0.0:5434:5432"

    command:
      - postgres
      # journalisation minimale en développement : seules les requêtes lentes
      # et les erreurs laissent une trace exploitable
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - log_checkpoints=on
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements

    # --- Performances -------------------------------------------------------
    # /dev/shm dimensionné : les workers parallèles et les tris volumineux
    # s'y écrivent. 64 Mo (valeur par défaut) provoque des erreurs
    # « could not resize shared memory segment ».
    shm_size: 512mb

    # Plafond de ressources. À laisser cohérent avec les réglages de
    # database/tuning.sql : shared_buffers (512 Mo) doit tenir dans la limite.
    mem_limit: 2g
    mem_reservation: 1g

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriwater -d agriwater"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - agriwater_pgdata:/var/lib/postgresql/data

volumes:
  agriwater_pgdata:
    name: agriwater_pgdata